# Propiedades físicas independientes de geometry.toml.
[fluid]
rho = 1000.0       # kg/m3
nu = 5e-5          # viscosidad a cizalla cero [m2/s]
model = "carreau_yasuda"

[fluid.carreau_yasuda]
nu_inf = 3e-6
lambda_s = 2.0
n = 0.45
a = 2.0

[simulation]
mode = "steady"    # steady o transient
end = 2000         # iteraciones en steady; segundos en transient
write_interval = 100

[initial]
velocity = [0.0, 0.0, 0.0]
pressure_pa = 0.0

[boundaries.inlet]
type = "velocity"
speed = 0.01       # m/s, perpendicular hacia el interior
# Alternativa: velocity = [0.01, 0.0, 0.0]

[boundaries.outlet]
type = "pressure"
pressure_pa = 0.0  # presión relativa en Pa

# Las paredes y obstáculos son noSlip salvo indicación contraria.
[boundaries.block]
type = "slip"
