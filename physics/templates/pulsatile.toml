# Propiedades físicas independientes de geometry.toml.
[fluid]
rho = 1000.0       # kg/m3
nu = 1e-6          # m2/s; alternativa: mu = 0.001 Pa s

[simulation]
mode = "transient"
end = 2.0          # segundos
write_interval = 0.02
delta_t = 0.001
max_delta_t = 0.005
max_co = 0.5

[initial]
velocity = [0.0, 0.0, 0.0]
pressure_pa = 0.0

[boundaries.inlet]
type = "velocity_table"
# [tiempo (s), velocidad normal hacia adentro (m/s)]
table = [[0.0, 0.005], [0.25, 0.02], [0.5, 0.005], [0.75, 0.02], [1.0, 0.005], [1.25, 0.02], [1.5, 0.005], [1.75, 0.02], [2.0, 0.005]]

[boundaries.outlet]
type = "pressure"
pressure_pa = 0.0  # presión relativa en Pa

# Las paredes y obstáculos son noSlip salvo indicación contraria.
[boundaries.block]
type = "slip"
