site_name: Manual práctico de OpenFOAM
site_description: Tutoriales reproducibles y transitorios de OpenFOAM.com
site_url: https://juanjosecas.github.io/openFOAM-manual/
repo_url: https://github.com/juanjosecas/openFOAM-manual
theme:
  name: material
  language: es
nav:
  - Inicio: index.md
  - Estructura y estilo: estructura-y-estilo.md
  - Ejecución y variantes: guia-ejecucion-y-variantes.md
  - Gráficos y propiedades: graficos-y-propiedades.md
  - Propiedades de materiales: propiedades-de-materiales.md
  - PyVista: pyvista.md
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
